name: Build (Windows EXE + Android APK)

on:
  push:
    branches: ["main", "master", "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- tests
  tests:
    name: Unit tests (protocol + model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore & test
        run: |
          set -o pipefail
          dotnet test desktop/tests/VirtualJoyCon.Core.Tests/VirtualJoyCon.Core.Tests.csproj -c Release --logger "console;verbosity=detailed" 2>&1 | tee /tmp/t.log || {
            grep -E "Failed |Assert\\.|Error Message" -A2 /tmp/t.log | head -60 | sed 's/^/::error::/'
            exit 1; }

  # ------------------------------------------------------- input daemon (dex)
  daemon:
    name: Android input daemon (d8 dex jar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify runner Android SDK (preinstalled image)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" | tee -a "$GITHUB_ENV"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -2 || true
          ls "$ANDROID_HOME/build-tools" | head -5
          ls "$ANDROID_HOME/platforms" | head -5
      - name: Build vjc-daemon.jar
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :daemon:dexJar --no-daemon --stacktrace 2>&1 | tee /tmp/g.log || {
            grep -E "^e: |error:|^\* What went wrong" -A3 /tmp/g.log | head -50 | sed 's/^/::error::/' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: vjc-daemon
          path: android/daemon/build/libs/vjc-daemon.jar

  # ---------------------------------------------------------------- windows
  windows:
    name: Windows EXE
    needs: daemon
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Download input daemon
        uses: actions/download-artifact@v4
        with:
          name: vjc-daemon
          path: desktop/tools/daemon
      - name: Daemon README
        shell: pwsh
        run: |
          "Virtual Joy-Con input daemon - build of android/daemon (d8 dex jar)." | Set-Content desktop/tools/daemon/README.txt
      - name: Publish EXE (self-contained single file)
        run: >
          dotnet publish desktop/src/VirtualJoyCon.DesktopApp/VirtualJoyCon.DesktopApp.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/VirtualJoyCon
      - name: Publish relay tool
        run: >
          dotnet publish desktop/tools/VjcRelay/VjcRelay.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -o publish/VjcRelay
      - name: Stage zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force zipstage | Out-Null
          Copy-Item -Recurse -Force publish/VirtualJoyCon/* zipstage/
          New-Item -ItemType Directory -Force zipstage/relay | Out-Null
          Copy-Item -Force publish/VjcRelay/* zipstage/relay/
          Set-Content -Path zipstage/LEIA-ME.txt -Encoding utf8 -Value @(
            "VIRTUAL JOY-CON (JoyLiveEX) - app para Windows",
            "",
            "1. Execute VirtualJoyCon.exe",
            "2. Modo USB: instale o Android platform-tools (winget install Google.PlatformTools),",
            "   ative a Depuracao USB no celular, conecte o cabo e autorize o computador.",
            "3. Modo LAN/Internet: abra o app Virtual Joy-Con no Android e use o codigo da sessao exibido aqui.",
            "4. Clique em INICIAR CONTROLE. O daemon de entrada (vjc-daemon.jar) e enviado ao celular",
            "   apenas com sua permissao, via adb shell - nenhuma instalacao silenciosa.",
            "",
            "relay opcional para Internet entre redes diferentes: pasta relay/VjcRelay.exe (porta UDP 8722)."
          )
      - name: Zip artifact
        shell: pwsh
        run: Compress-Archive -Path zipstage/* -DestinationPath VirtualJoyCon-Windows.zip -Force
      - name: Verify zip contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead("$PWD/VirtualJoyCon-Windows.zip")
          $names = $z.Entries | Where-Object { $_.Length -gt 10kb -or $_.Name -match "(daemon|LEIA|README)" } | ForEach-Object { "{0} ({1:n0} KB)" -f $_.FullName, ($_.Length/1kb) }
          $z.Dispose()
          ($names | Select-Object -First 30) -join "`n" | ForEach-Object { "::notice::zip: $_" }
          if (-not ($names -match "VirtualJoyCon.exe")) { "::error::VirtualJoyCon.exe missing from zip"; exit 1 }
          if (-not ($names -match "vjc-daemon.jar")) { "::error::vjc-daemon.jar missing from zip"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: VirtualJoyCon-Windows
          path: VirtualJoyCon-Windows.zip

  # ---------------------------------------------------------------- android
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify runner Android SDK (preinstalled image)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" | tee -a "$GITHUB_ENV"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -2 || true
      - name: Unit tests
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --continue 2>&1 | tee /tmp/g.log || {
            grep -E "^e: |error:|FAILED|AssertionError|expected:|^\* What went wrong" -A5 /tmp/g.log | head -80 | sed 's/^/::error::/' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1; }
      - name: Build APKs
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug :daemon:dexJar --no-daemon --stacktrace 2>&1 | tee /tmp/g2.log || {
            grep -E "^e: |error:|^\* What went wrong" -A3 /tmp/g2.log | head -60 | sed 's/^/::error::/' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1; }
      - name: Stage artifacts
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk VirtualJoyCon-Android.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk VirtualJoyCon-Android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VirtualJoyCon-Android
          path: |
            VirtualJoyCon-Android.apk
            VirtualJoyCon-Android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vjc-daemon-apk-pair
          path: android/daemon/build/libs/vjc-daemon.jar

  # ---------------------------------------------------------- GitHub Release
  release:
    name: GitHub Release
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/01a0da21-joyliveex' || github.event_name == 'workflow_dispatch'
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VirtualJoyCon-Windows
      - uses: actions/download-artifact@v4
        with:
          name: VirtualJoyCon-Android
      - name: Create draft release
        run: |
          set -o pipefail
          TAG="v$(date -u +%Y%m%d.%H%M%S)"
          ls -la VirtualJoyCon-Windows.zip VirtualJoyCon-Android.apk VirtualJoyCon-Android-debug.apk || true
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then gh release delete "$TAG" --yes --repo "$GITHUB_REPOSITORY" || true; fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "${{ github.sha }}" \
            --title "Virtual Joy-Con — build ${{ github.sha }}" \
            --notes "Artifacts: VirtualJoyCon-Windows.zip (EXE + relay) e VirtualJoyCon-Android.apk (release + debug). O APK release usa a debug-key quando VJC_KEYSTORE nao esta configurado — veja docs/BUILD.md." \
            VirtualJoyCon-Windows.zip VirtualJoyCon-Android.apk VirtualJoyCon-Android-debug.apk 2>&1 | tee /tmp/rel.log || {
            sed 's/^/::error::/' /tmp/rel.log | head -10; exit 1; }
          echo "release created: $TAG" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
